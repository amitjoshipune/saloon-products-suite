<!DOCTYPE html>
<html>
<head>

<meta charset="utf-8">

<title>Salon Status</title>

<style>

body{
    font-family:Arial,sans-serif;
    margin:20px;
    background:#111;
    color:white;
}

h1{
    margin-bottom:5px;
}

#address{
    color:#bbb;
    margin-bottom:20px;
}

.chair{
    padding:15px;
    margin-bottom:12px;
    border-radius:8px;
}

.available{
    background:#1d9c47;
}

.busy{
    background:#c62828;
}

.unavailable{
    background:#777;
}

select{
    padding:5px;
    width:200px;
}

button{
    padding:10px;
}
</style>

</head>
<body>

<h1 id="salonName">Loading...</h1>

<div id="address"></div>

<button onclick="adminLogin()">
Admin
</button>

<hr>

<div id="chairs"></div>

<script>

const salon =
(
    new URLSearchParams(
        window.location.search
    )
).get("salon");

let salonData = null;

let adminMode = false;

let adminCode = "";

function createChairHtml(chair)
{
    const disabled =
        adminMode ? "" : "disabled";

    return `
        <div class="chair ${chair.status}">
            <h3>${chair.name}</h3>

            <select
                ${disabled}
                onchange="
                updateChair(
                    ${chair.id},
                    this.value
                )">

                <option value="available"
                ${chair.status==="available"?"selected":""}>
                Available
                </option>

                <option value="busy"
                ${chair.status==="busy"?"selected":""}>
                Busy
                </option>

                <option value="unavailable"
                ${chair.status==="unavailable"?"selected":""}>
                Unavailable
                </option>

            </select>

        </div>
    `;
}

async function loadSalon()
{
    const response =
        await fetch(
        `/api/status?salon=${salon}`
        );

    salonData =
        await response.json();

    document.getElementById(
        "salonName"
    ).textContent =
        salonData.name;

    document.getElementById(
        "address"
    ).textContent =
        salonData.address || "";

    drawChairs();
}

function drawChairs()
{
    let html = "";

    salonData.chairs.forEach(
        chair => {
            html +=
              createChairHtml(
                chair
              );
        }
    );

    document.getElementById(
        "chairs"
    ).innerHTML = html;
}

function adminLogin()
{
    const code =
        prompt(
          "Enter admin code"
        );

    if(!code)
    {
        return;
    }

    adminCode = code;

    adminMode = true;

    drawChairs();
}

async function updateChair(
    chairId,
    newStatus
)
{
    const chair =
        salonData.chairs.find(
            x => x.id === chairId
        );

    chair.status =
        newStatus;

    const response =
        await fetch(
            "/api/update",
            {
                method:"POST",

                headers:{
                    "Content-Type":
                    "application/json"
                },

                body:
                JSON.stringify({
                    salon: salon,
                    adminCode:
                    adminCode,
                    chairs:
                    salonData.chairs
                })
            }
        );

    if(response.status === 403)
    {
        alert(
          "Invalid admin code"
        );

        adminMode = false;

        loadSalon();

        return;
    }

    loadSalon();
}

loadSalon();

setInterval(
    loadSalon,
    5000
);

</script>

</body>
</html>
